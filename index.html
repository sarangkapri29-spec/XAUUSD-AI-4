<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Market Analyst - Live V1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0f19; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .nav-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-right: 8px; font-weight: 600; }
        .nav-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
        .action-btn { background: #2563eb; color: #fff; padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 20px; }
        .price { font-size: 38px; font-weight: 800; color: #fff; margin: 10px 0; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; background: #374151; color: #fbbf24; }
        .confidence-bar { background: #1f2937; height: 10px; border-radius: 5px; width: 100%; margin: 15px 0; overflow: hidden; }
        .confidence-fill { background: #3b82f6; height: 100%; width: 0%; transition: width 0.3s; }
        .reasoning { font-size: 14px; line-height: 1.6; color: #cbd5e1; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>AI Market Analyst <span style="font-size:12px; color:#10b981;">● LIVE</span></h2>
            <button class="action-btn" onclick="runAnalysis()">↻ Analyze Live</button>
        </div>

        <div>
            <button class="nav-btn active" onclick="switchSymbol('XAU/USD', this)">XAUUSD</button>
            <button class="nav-btn" onclick="switchSymbol('EUR/USD', this)">EURUSD</button>
            <button class="nav-btn" onclick="switchSymbol('NASDAQ', this)">NASDAQ</button>
            <button class="nav-btn" onclick="switchSymbol('US30', this)">US30</button>
        </div>

        <div class="grid">
            <div class="card">
                <div style="display:flex; justify-content:space-between;">
                    <h3 id="symbolTitle">XAU/USD</h3>
                    <span id="biasBadge" class="badge">STANDBY</span>
                </div>
                <div id="priceDisplay" class="price">----.--</div>
                <div>Confidence: <span id="confText">--</span>/100</div>
                <div class="confidence-bar"><div id="confFill" class="confidence-fill"></div></div>
            </div>

            <div class="card">
                <h3>AI Technical Reasoning</h3>
                <p id="reasoningText" class="reasoning" style="margin-top:10px;">Press "Analyze Live" to fetch market data and AI bias.</p>
            </div>
        </div>
    </div>

    <script>
        let currentSymbol = 'XAU/USD';

        function switchSymbol(sym, btn) {
            currentSymbol = sym;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('symbolTitle').innerText = sym;
            runAnalysis();
        }

        async function runAnalysis() {
            document.getElementById('reasoningText').innerText = "Fetching live market data and running OpenAI analysis...";
            try {
                const res = await fetch(`/api/analyze?symbol=${encodeURIComponent(currentSymbol)}`);
                const data = await res.json();
                
                if(data.error) throw new Error(data.error);

                document.getElementById('priceDisplay').innerText = data.price || '----.--';
                document.getElementById('biasBadge').innerText = data.bias || 'NEUTRAL';
                document.getElementById('confText').innerText = data.confidence || '50';
                document.getElementById('confFill').style.width = (data.confidence || 50) + '%';
                document.getElementById('reasoningText').innerText = data.reasoning || 'Analysis complete.';
            } catch(e) {
                document.getElementById('reasoningText').innerText = "Error: " + e.message;
            }
        }
    </script>
</body>
</html>
